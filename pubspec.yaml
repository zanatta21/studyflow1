name: studyflow
description: Organização dos estudos - armazenamento local (sem Firebase)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  percent_indicator: ^4.2.3
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
